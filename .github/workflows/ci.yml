name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bunx tsc --noEmit

      # Pre-existing lint debt is not this workflow's problem to gate on.
      # Flip to `continue-on-error: false` once `bun run lint` is clean on main.
      - name: Lint
        run: bun run lint
        continue-on-error: true

      - name: Build
        run: bun run build

      - name: Unit tests
        run: bun run test
